<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Ocean Teal to Darker Teal (Matching site color system) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A9D8F" /> <!-- Deep Ocean Teal -->
      <stop offset="100%" stop-color="#1E7066" /> <!-- Dark Teal Accent -->
    </linearGradient>
    
    <!-- Checkmark Accent Gradient: Dusty Rose to Mint Green (Matching site accent) -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAB1A0" /> <!-- Dusty Rose Pink -->
      <stop offset="100%" stop-color="#81ECEC" /> <!-- Soft Mint/Teal Glow -->
    </linearGradient>

    <!-- Symbol White Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2A9D8F" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Left: Rounded-Square Icon Symbol (x=30, y=30, w=140, h=140) -->
  <rect x="30" y="30" width="140" height="140" rx="36" fill="url(#bgGrad)" />

  <g filter="url(#glow)" transform="translate(30, 30) scale(0.273)">
    <!-- Outer "C" (Campus) -->
    <path d="M 280 100 
             C 170 100, 100 170, 100 280 
             C 100 390, 170 460, 280 460" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="36" 
          stroke-linecap="round" />

    <!-- Inner "C" (Copilot) -->
    <path d="M 280 180 
             C 210 180, 170 220, 170 280 
             C 170 340, 210 380, 280 380" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="30" 
          stroke-linecap="round" 
          opacity="0.9" />

    <!-- AI Copilot Node (Center Orb) -->
    <circle cx="280" cy="280" r="28" fill="#FFFFFF" />

    <!-- Checkmark Completion Indicator (Vibrant Cyan-Green Gradient) -->
    <path d="M 240 280 
             L 280 320 
             L 370 210" 
          fill="none" 
          stroke="url(#checkGrad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Right: Wordmark Text Group (CAMPUS COPILOT) -->
  <text x="200" y="118" 
        font-family="'Space Grotesk', 'Inter', sans-serif" 
        font-size="44px" 
        font-weight="500" 
        letter-spacing="1px" 
        fill="#4A4A4A">CAMPUS</text>
        
  <text x="402" y="118" 
        font-family="'Space Grotesk', 'Inter', sans-serif" 
        font-size="44px" 
        font-weight="700" 
        letter-spacing="1.5px" 
        fill="#2A9D8F">COPILOT</text> <!-- Updated to match Deep Ocean Teal (#2A9D8F) -->

  <!-- Subtitle descriptor (SaaS style) -->
  <text x="202" y="152" 
        font-family="'Inter', sans-serif" 
        font-size="14px" 
        font-weight="600" 
        letter-spacing="2.5px" 
        fill="#FAB1A0" 
        opacity="0.95">INTELLIGENT FORM COMPANION</text> <!-- Dusty Rose Pink (#FAB1A0) -->
</svg>
